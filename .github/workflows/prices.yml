name: Kurse laden
on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"  # alle 15 Min. von 8 bis 22:45 Uhr deutscher Zeit (Winterzeit), Mo–Fr
    - cron: "10 22 * * 1-5"      # Nachzügler nach US-Schluss
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_prices.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
concurrency: { group: prices, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_prices.py
      - name: Speichern
        run: |
          git config user.name "portfolio-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurse $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
