name: Kurse laden
on:
  schedule:
    - cron: "30 7 * * 1-5"   # 8:30 Uhr – morgens
    - cron: "0 13 * * 1-5"   # 14:00 Uhr – vor dem News-Check 14:15
    - cron: "25 16 * * 1-5"  # 17:25 Uhr – vor dem News-Check 17:45
    - cron: "10 21 * * 1-5"  # 22:10 Uhr – abends nach US-Schluss, vor der Abendanalyse
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_prices.py", "scripts/fetch_market.py", "scripts/track.py", "scripts/fetch_fund.py", "scripts/fetch_screen.py", ".github/workflows/prices.yml", "data/refresh.txt", "data/stocks.json"]
permissions:
  contents: write
concurrency: { group: prices, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_prices.py
      - name: Markt-Cockpit und Kennzahlen
        run: python scripts/fetch_market.py
        continue-on-error: true
      - name: Analysten und Fundamentaldaten
        run: python scripts/fetch_fund.py
        continue-on-error: true
      - name: Chancen-Finder
        run: python scripts/fetch_screen.py
        continue-on-error: true
      - name: Trefferquote
        run: python scripts/track.py
        continue-on-error: true
      - name: Speichern
        run: |
          git config user.name "portfolio-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Kurse $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
